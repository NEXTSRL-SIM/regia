<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regia - Next</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--ground:#100E0C;--surface:#1A1613;--surface-2:#231D19;--surface-3:#2C251F;--ink:#F2EBE3;--ink-2:#AFA49A;--ink-3:#7C716A;--line:#332B25;--line-2:#453A32;--amber:#E2A24C;--amber-dim:#7A5622;--amber-wash:#241A0E;--sage:#7FB08B;--sage-dim:#22321F;--brick:#CE6A45;--brick-dim:#3A1F16;--display:"Bricolage Grotesque",Arial,sans-serif;--sans:"IBM Plex Sans",Arial,sans-serif;--mono:"IBM Plex Mono",Menlo,monospace}
:root[data-tema="chiaro"]{--ground:#F7F4EF;--surface:#FFFFFF;--surface-2:#F1ECE4;--surface-3:#E7E1D6;--ink:#1C1815;--ink-2:#574E47;--ink-3:#8A8078;--line:#E2DBD1;--line-2:#CDC3B6;--amber:#8A5C12;--amber-dim:#F2E3C8;--amber-wash:#FBF4E6;--sage:#2F6B41;--sage-dim:#E3F0E5;--brick:#A8401C;--brick-dim:#FAE2D8}
:root[data-tema="chiaro"] .porta button{color:#3A2A0C}
:root[data-tema="chiaro"] .nastro{color:#4A3208}
:root[data-tema="chiaro"] .nastro b{color:#2E1F04}
:root[data-tema="chiaro"] .tasto[aria-pressed=true]{color:#3A2A0C}
:root[data-tema="chiaro"] .tasto.entra[aria-pressed=true]{color:#1C4426}
:root[data-tema="chiaro"] .tasto.chiudi:hover{color:#6E2610}
:root[data-tema="chiaro"] .esitov.ok,:root[data-tema="chiaro"] .vincoli.ok{color:#1C4426}
:root[data-tema="chiaro"] .esitov.att,:root[data-tema="chiaro"] .vincoli.att{color:#5A3D06}
:root[data-tema="chiaro"] .esitov.no,:root[data-tema="chiaro"] .vincoli.no{color:#6E2610}
:root[data-tema="chiaro"] .banda.rosso,:root[data-tema="chiaro"] .banda.giallo,:root[data-tema="chiaro"] .banda.verde{color:var(--ink)}
/* nel tema chiaro i colori tenui sparivano: qui si caricano, senza cambiare
   la forma di niente - solo il colore, come chiesto */
:root[data-tema="chiaro"] .spia.verde{background:#0F7A3D;box-shadow:0 0 0 2px #CFEBD8}
:root[data-tema="chiaro"] .spia.giallo{background:#B5750A;box-shadow:0 0 0 2px #F6E7C4}
:root[data-tema="chiaro"] .spia.rosso{background:#C0391A;box-shadow:0 0 0 2px #F8D9CE}
:root[data-tema="chiaro"] .l-flash.verde{color:#0F5C30}
:root[data-tema="chiaro"] .l-flash.giallo{color:#8A5405}
:root[data-tema="chiaro"] .l-flash.rosso{color:#96280C}
:root[data-tema="chiaro"] .linea[aria-current=true]{box-shadow:inset 3px 0 0 #B5750A}
:root[data-tema="chiaro"] .banda.verde{background:#DAEFE1;box-shadow:inset 4px 0 0 #0F7A3D}
:root[data-tema="chiaro"] .banda.verde .bollo{background:#0F7A3D}
:root[data-tema="chiaro"] .banda.giallo{background:#FBEFD3;box-shadow:inset 4px 0 0 #B5750A}
:root[data-tema="chiaro"] .banda.giallo .bollo{background:#B5750A}
:root[data-tema="chiaro"] .banda.rosso{background:#FADFD5;box-shadow:inset 4px 0 0 #C0391A}
:root[data-tema="chiaro"] .banda.rosso .bollo{background:#C0391A}
:root[data-tema="chiaro"] .sal{border-left-width:4px;padding:3px 8px 3px 10px;border-radius:0 4px 4px 0}
:root[data-tema="chiaro"] .sal.verde{border-left-color:#0A8A45;background:#E6F5EC}
:root[data-tema="chiaro"] .sal.verde span{color:#0B4A28}
:root[data-tema="chiaro"] .sal.giallo{border-left-color:#C88208;background:#FCF0D8}
:root[data-tema="chiaro"] .sal.giallo span{color:#6E4A03}
:root[data-tema="chiaro"] .sal.rosso{border-left-color:#D63F18;background:#FCE4DB}
:root[data-tema="chiaro"] .sal.rosso span{color:#8E2409}
:root[data-tema="chiaro"] .sal time{color:#6B6058}
:root[data-tema="chiaro"] .vincoli.ok .bollo{background:#0F7A3D}
:root[data-tema="chiaro"] .vincoli.att .bollo{background:#B5750A}
:root[data-tema="chiaro"] .vincoli.no .bollo{background:#C0391A}
.tema{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;padding:2px 8px;opacity:.85}
.tema:hover{opacity:1}
#bPieno{margin-left:8px}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}a{color:inherit}
.porta{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.porta form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.porta h1{font-family:var(--display);font-weight:800;font-size:30px;margin:0;letter-spacing:-.02em}
.porta p{margin:0;color:var(--ink-2);font-size:14.5px}
.porta input{background:var(--surface);border:1px solid var(--line-2);color:var(--ink);padding:13px 14px;font:inherit;font-family:var(--mono)}
.porta input:focus{outline:2px solid var(--amber);outline-offset:1px}
.porta button{background:var(--amber-dim);color:#FBE9CF;padding:13px;font-weight:600;border:1px solid var(--amber)}
.porta .no{color:var(--brick);font-size:13.5px;min-height:20px;margin:0}
.nastro{background:var(--amber-dim);color:#F6DFBE;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:7px 20px;display:flex;gap:18px;flex-wrap:wrap}
.nastro b{color:#FFF3E2;font-weight:500}
.schede{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 20px;flex-wrap:wrap}
.st{padding:12px 16px;font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.st[aria-selected=true]{color:var(--amber);border-bottom-color:var(--amber)}
.st.urgente{color:var(--brick)}
.st.urgente span{background:var(--brick);color:#fff;border-radius:8px;padding:1px 6px;margin-left:3px}
.rich{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);padding:14px 16px;margin-bottom:10px}
.rich-quando b{display:block;font-family:var(--mono);font-size:17px}
.rich-quando span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.rich.adesso{border-color:var(--brick)}
.rich.adesso .rich-quando b{color:var(--brick)}
.rich.a-momenti{border-color:var(--amber)}
.rich.a-momenti .rich-quando b{color:var(--amber)}
.rich-chi .tastoNome{font-size:15px}
.rich-chi .sintesi{margin:5px 0 0}
.rich-fare{display:flex;gap:8px}
.rich-fare .tasto{padding:8px 12px;font-size:12.5px}
.nascosto{display:none!important}
.telaio{display:grid;grid-template-columns:298px minmax(0,1fr) 336px;gap:1px;background:var(--line);height:calc(100vh - 78px);min-height:0;overflow:hidden}
.col{background:var(--ground);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.col.dx{overflow-y:auto}
.titolo{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between}
.titolo h2{font-family:var(--display);font-weight:600;font-size:14.5px;margin:0}
.conta{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
/* l elenco cresce fino a quattro telefonate, poi scorre lui; quello che
   resta sotto e per i dati raccolti, che scorrono a loro volta se non ci stanno */
.linee{flex:0 1 auto;max-height:420px;min-height:84px;overflow-y:auto}
.sotto{flex:1 1 auto;min-height:0;overflow-y:auto;border-top:1px solid var(--line)}
.sotto .blocco:first-child{border-top:0}
.linea{width:100%;text-align:left;display:grid;grid-template-columns:9px 1fr;gap:11px;padding:13px 17px;border-bottom:1px solid var(--line)}
.linea:hover{background:var(--surface)}
.linea[aria-current=true]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--amber)}
.linea.spenta{cursor:default}.linea.spenta:hover{background:none}
.linea.spenta .spia{background:var(--line-2)}
.spia{width:9px;height:9px;border-radius:50%;margin-top:5px}
.spia.rosso{background:var(--brick);animation:p 1.3s infinite}.spia.giallo{background:var(--amber)}.spia.verde{background:var(--sage)}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.spia.rosso{animation:none}}
.l-nome{font-weight:600;font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-dati{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:block;margin-top:2px}
.l-dati b{font-weight:400;color:var(--ink-2);font-variant-numeric:tabular-nums}
.l-flash{font-size:12.5px;margin-top:6px;line-height:1.35;display:block}
.l-flash.rosso{color:var(--brick)}.l-flash.giallo{color:var(--amber)}.l-flash.verde{color:var(--sage)}
.onda{display:flex;gap:2px;align-items:flex-end;height:13px;margin-top:7px}
.onda i{width:2px;background:var(--ink-3);opacity:.5;height:3px;animation:vibra 1s infinite ease-in-out}
.linea[aria-current=true] .onda i{background:var(--amber);opacity:.85}
.onda i:nth-child(1){animation-delay:0s}.onda i:nth-child(2){animation-delay:.12s}.onda i:nth-child(3){animation-delay:.24s}
.onda i:nth-child(4){animation-delay:.36s}.onda i:nth-child(5){animation-delay:.18s}.onda i:nth-child(6){animation-delay:.3s}
@keyframes vibra{0%,100%{height:3px}50%{height:13px}}
@media(prefers-reduced-motion:reduce){.onda i{animation:none;height:7px}}
.banda{display:flex;gap:13px;align-items:flex-start;padding:15px 20px;border-bottom:1px solid var(--line)}
.banda .bollo{width:13px;height:13px;border-radius:50%;margin-top:4px;flex:none}
.banda.rosso{background:var(--brick-dim)}.banda.rosso .bollo{background:var(--brick)}
.banda.giallo{background:var(--amber-wash)}.banda.giallo .bollo{background:var(--amber)}
.banda.verde{background:var(--sage-dim)}.banda.verde .bollo{background:var(--sage)}
.banda.spenta{background:var(--surface)}.banda.spenta .bollo{background:var(--line-2)}
.banda.spenta h3{color:var(--ink-2)}
.spento{color:var(--ink-3)}
.parlato .et{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.tasto[disabled]{opacity:.45;cursor:default}
.tasto em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-left:5px}
.suggerisci input[disabled],.suggerisci button[disabled]{opacity:.45;cursor:default}
.banda h3{font-family:var(--display);font-weight:800;font-size:16.5px;margin:0 0 3px}
.banda p{margin:0;font-size:13.5px;color:var(--ink-2)}
.banda .quando{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto;white-space:nowrap;padding-top:4px}
.capo{padding:17px 20px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.capo h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
.capo .sotto{font-family:var(--mono);font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:14px}
.grosso{font-family:var(--mono);font-size:28px;font-variant-numeric:tabular-nums;line-height:1;text-align:right;min-width:5ch;font-feature-settings:"tnum" 1}
.grosso small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.flusso{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-height:150px}
.evento{display:grid;grid-template-columns:52px 10px 1fr;gap:12px;align-items:start}
.evento time{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);padding-top:2px;font-variant-numeric:tabular-nums}
.evento .pallo{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--ink-3)}
.evento.rosso .pallo{background:var(--brick)}.evento.giallo .pallo{background:var(--amber)}.evento.verde .pallo{background:var(--sage)}
.evento p{margin:0;font-size:14px}
.dett{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:baseline}
.dett .chi{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding-top:3px}
.dett.cliente .chi{color:#79A6C4}
.dett.valentino .chi{color:var(--amber)}
.dett p{margin:0;max-width:62ch}
.dett.valentino p{color:var(--ink-2)}
.evento.rosso p{color:var(--brick)}
.vuoto{color:var(--ink-3);font-size:14px;padding:34px 20px;text-align:center;line-height:1.6}
.scia{border-top:1px solid var(--line);background:var(--surface-2);padding:11px 20px 12px;display:flex;align-items:baseline;gap:16px}
.scia-et{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.scia-righe{display:flex;overflow-x:auto;padding-bottom:2px}
.tappa{display:flex;align-items:baseline;gap:7px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;padding:0 14px;border-left:1px solid var(--line-2)}
.tappa:first-child{padding-left:0;border-left:none}
.tappa time{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.tappa.ora,.tappa.ora time{color:var(--amber)}
.banco{border-top:1px solid var(--line);background:var(--surface);padding:13px 20px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.tasto{display:inline-flex;align-items:center;gap:9px;padding:10px 15px;border:1px solid var(--line-2);background:var(--surface-2);font-size:13.5px;font-weight:500;text-decoration:none}
.tasto:hover{border-color:var(--ink-3);background:var(--surface-3)}
.tasto .led{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.tasto[aria-pressed=true]{border-color:var(--amber);background:var(--amber-dim);color:#FBE9CF}
.tasto[aria-pressed=true] .led{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.tasto.entra[aria-pressed=true]{border-color:var(--sage);background:var(--sage-dim);color:#DCEFE0}
.tasto.entra[aria-pressed=true] .led{background:var(--sage);box-shadow:0 0 6px var(--sage)}
.tasto.prendi{margin-left:auto}
/* i tasti che cambiano scritta tengono una larghezza minima, se no ballano */
#bAsc{min-width:168px;justify-content:center}
#bPrendi{min-width:190px;justify-content:center}
.datario{display:inline-flex;align-items:center;gap:7px;margin-left:4px}
.datario input{background:var(--ground);border:1px solid var(--line-2);color:var(--ink);font:inherit;font-size:12.5px;padding:8px 10px}
.datario input:focus{outline:2px solid var(--amber);outline-offset:1px}
.datario[hidden]{display:none}
.tasto.prendi[data-stato=squilla]{border-color:var(--sage);background:var(--sage-dim);animation:p 1s infinite}
.tasto.prendi[data-stato=in-linea]{border-color:var(--brick);background:var(--brick-dim)}
.tasto.prendi[data-stato=attesa]{opacity:.6}
.tasto.prendi[data-stato=guasto]{border-color:var(--brick-dim);color:var(--ink-3)}
.tasto.chiudi{border-color:var(--brick-dim);color:var(--brick)}
.tasto.chiudi:hover{border-color:var(--brick);background:var(--brick-dim);color:#F6D9CC}
.avviso{padding:9px 20px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;display:flex;gap:9px;align-items:center;border-top:1px solid var(--line)}
.avviso .pt{width:7px;height:7px;border-radius:50%;background:currentColor}
.parlato{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 18px;background:var(--ground)}
.parlato .bt{font-size:15px}
.salienti{border-bottom:1px solid var(--line);background:var(--surface);padding:12px 20px 13px;max-height:230px;overflow-y:auto}
.salienti .et{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.sal-righe{display:flex;flex-direction:column;gap:5px}
.sal{display:grid;grid-template-columns:46px 1fr;gap:10px;font-size:13px;line-height:1.4;padding-left:9px;border-left:2px solid var(--line-2)}
.sal time{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.sal.rosso{border-left-color:var(--brick)}.sal.rosso span{color:var(--brick)}
.sal.giallo{border-left-color:var(--amber)}
.sal.verde{border-left-color:var(--sage)}
.vincoli{display:flex;gap:11px;align-items:flex-start;padding:13px 17px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.vincoli .bollo{width:12px;height:12px;border-radius:50%;margin-top:3px;flex:none;background:var(--ink-3)}
.vincoli.ok{background:var(--sage-dim);color:#CFE6D5}.vincoli.ok .bollo{background:var(--sage)}
.vincoli.att{background:var(--amber-wash);color:#F3DDBB}.vincoli.att .bollo{background:var(--amber)}
.vincoli.no{background:var(--brick-dim);color:#F2D2C6}.vincoli.no .bollo{background:var(--brick)}
.vincoli b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;opacity:.8;margin-bottom:3px;font-weight:500}
.parlato .et{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px;display:flex;gap:9px;align-items:center}
.parlato .et .vivo{width:7px;height:7px;border-radius:50%;background:var(--sage);animation:p 1.3s infinite}
.bt{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:3px 0;font-size:13.5px;line-height:1.45}
.bt .chi{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding-top:3px}
.bt.cliente .chi{color:var(--amber)}
.bt.valentino .chi{color:var(--sage)}
.bt.corso{opacity:.6;font-style:italic}
.suggerisci{display:flex;gap:8px;padding:11px 20px;border-top:1px solid var(--line);background:var(--surface-2)}
.suggerisci input{flex:1;background:var(--ground);border:1px solid var(--line-2);color:var(--ink);padding:10px 12px;font:inherit;font-size:13.5px}
.suggerisci input:focus{outline:2px solid var(--amber);outline-offset:1px}
.suggerisci button{border:1px solid var(--line-2);background:var(--surface-3);padding:0 14px;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;min-width:44px}
.suggerisci button svg{display:block}
.suggerisci button.dett[aria-pressed=true]{border-color:var(--brick);background:var(--brick-dim);color:#F6D9CC}
.detto{padding:0 20px 10px;font-size:12.5px;color:var(--sage);background:var(--surface-2)}
/* il modulo dei social: domanda a sinistra in chiaro, il dato a destra in grassetto */
.chiesto .cq{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:5px 0;border-bottom:1px dotted var(--line)}
.chiesto .cq:last-child{border-bottom:none}
.chiesto .cq span{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.chiesto .cq b{font-size:13.5px;font-weight:700;color:var(--ink);text-align:right;flex:0 0 auto;max-width:55%}
/* il tasto Formazione e il suo pannello */
.tasto.forma{border-color:var(--line-2)}
.tasto.forma:hover{border-color:var(--sage);background:var(--sage-dim);color:#DCEFE0}
.fblocco{padding:16px 18px;border-bottom:1px solid var(--line)}
.fblocco textarea{width:100%;box-sizing:border-box;background:var(--ground);border:1px solid var(--line-2);color:var(--ink);padding:10px 12px;font:inherit;font-size:13.5px;line-height:1.5;resize:vertical}
.fblocco textarea:focus{outline:2px solid var(--amber);outline-offset:1px}
.frighe{display:flex;gap:9px;margin-top:10px}
.fesito{margin-top:13px}

const API = 'https://pnxhthrheqeucoisifjw.supabase.co/functions/v1/regia';

let datarioAperto = null, annullaChiesto = null;
/* dall istante ISO al formato che vuole il campo datario del browser, in ora
   locale: 2026-09-08T15:30 */
function perDatario(iso){
  try{
    const d = iso ? new Date(iso) : new Date();
    if(isNaN(d.getTime())) return '';
    const p = n => String(n).padStart(2,'0');
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());
  }catch(e){ return ''; }
}
let parlato = [], parlatoDb = [], corso = {}, parlatoConv = null, ricon = null, firmaChiuse = '';

/* la conversazione che si scrive mentre si parla */
function dipingiParlato(){
  const p = document.getElementById('parlato'); if(!p) return;
  const vivo = (audioWs && audioWs.readyState === 1);
  /* le battute arrivano dai dati, scritte in archivio mentre si parla: il tubo

  /* LE DUE FONTI SI SOMMANO, NON SI ESCLUDONO. Prima era
       parlatoDb.length ? parlatoDb : parlato
     cioe: appena arrivava la prima battuta dall archivio, quelle in diretta

  let righe = parlatoDb;

    if(code.length) righe = parlatoDb.concat(code);

/* ---- il telefono dentro la pagina ----------------------------------
   Quando si preme "prendo io", Twilio dirotta la telefonata viva qui:

let apparecchio = null, inLinea = null, statoTel = 'spento';

function segnaTel(s, testo){
  statoTel = s;
  const b = document.getElementById('bPrendi');
  if(b){
    b.setAttribute('data-stato', s);
    if(testo) b.innerHTML = testo;
  }
}

async function accendiTelefono(){
  if(apparecchio || !window.Twilio || !Twilio.Device) return;
  let j;
  try{
    const r = await fetch(API + '-telefono?t=' + encodeURIComponent(PASS) + '&chi=' + encodeURIComponent((CHI||'regia').toLowerCase().replace(/[^a-z0-9]/g,'')||'regia'));
    j = await r.json();
  }catch(e){ return; }
  if(!j || !j.ok) return;
  try{
    apparecchio = new Twilio.Device(j.token, {codecPreferences:['opus','pcmu'], logLevel:'error'});
    apparecchio.on('registered', () => segnaTel('pronto'));
    apparecchio.on('error', () => segnaTel('guasto'));
    apparecchio.on('incoming', (c) => {
      inLinea = c;
      segnaTel('squilla', 'Rispondi');
      c.on('disconnect', () => { inLinea = null; segnaTel('pronto', 'Prendo io la chiamata'); });
      c.on('cancel',     () => { inLinea = null; segnaTel('pronto', 'Prendo io la chiamata'); });
      /* si risponde da soli: chi ha premuto il tasto sta gia aspettando */
      try{ c.accept(); segnaTel('in-linea', 'Chiudi e riattacca'); }catch(e){}
    });
    await apparecchio.register();
  }catch(e){ segnaTel('guasto'); }
}

async function prendiChiamata(c){
  if(inLinea){ try{ inLinea.disconnect(); }catch(e){} inLinea = null; segnaTel('pronto','Prendo io la chiamata'); return; }
  await accendiTelefono();
  if(statoTel === 'spento' || statoTel === 'guasto'){
    avvisa('il telefono nella pagina non parte');
    return;
  }
  segnaTel('attesa', 'Sto passando&hellip;');
  try{
    const r = await fetch(API + '-prendi', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({t: PASS, c: c,
        chi: (CHI||'regia').toLowerCase().replace(/[^a-z0-9]/g,'')||'regia',
        nome: CHI || ''})});
    const j = await r.json();
    if(!j || !j.ok){ segnaTel('pronto','Prendo io la chiamata'); avvisa(j && j.errore ? j.errore : 'non riesco a passarla'); }
    else { const d = document.getElementById('detto'); if(d) d.textContent = 'la sto passando a ' + (CHI || 'lei'); }
  }catch(e){ segnaTel('pronto','Prendo io la chiamata'); avvisa('non riesco a passarla'); }
}

/* il suggerimento: lo legge Valentino, il cliente non lo sente */

    ricon = null;

/* mu-law verso numeri: la tabella si costruisce una volta sola.
   Il mescolamento delle due voci lo fa il computer di chi guarda: sul server
   costava la vita all orecchio, qui non si sente nemmeno. */
const MU = (function(){
  const t = new Float32Array(256);
  for(let i=0;i<256;i++){
    const u = ~i & 0xFF;
    const segno = (u & 0x80) ? -1 : 1;
    const esp = (u >> 4) & 7;
    const man = u & 15;
    let v = ((man << 1) + 33) << esp;
    v -= 33;
    t[i] = (segno * v * 4) / 32768;
  }
  return t;
})();

    let sa = null, sb = null;

    try{ if(b[k]) sb = atob(b[k]); }catch(e){}

      let v = 0;
      if(sa && i < sa.length) v += MU[sa.charCodeAt(i)];
      if(sb && i < sb.length) v += MU[sb.charCodeAt(i)];
      if(v > 1) v = 1; else if(v < -1) v = -1;
      d[base + i] = v;
    }
  }
  const s = ctx.createBufferSource();
  s.buffer = buf; s.connect(ctx.destination);
  const ora = ctx.currentTime;
  /* CUSCINETTO, quanto anticipo si tiene prima di suonare.
     Serve a coprire il pacchetto che tarda, quindi va largo quanto il ritardo
     PEGGIORE, non quanto quello medio: piu il percorso e irregolare, piu deve
     essere grande, e piu si ascolta in ritardo.
       - dal canale diretto dell orecchio (un solo collegamento sempre aperto,
         i pacchetti arrivano regolari come li manda Twilio): 0,30 s.
       - dal giro lungo (orecchio -> una richiesta HTTP nuova ogni 240 ms verso
         il Realtime -> edge -> pagina, con la edge che muore ogni 150 s e si
         riaggancia): 0,90 s, ed e quello che si sentiva a scatti. */
  const cuscino = diretto ? 0.30 : 0.90;
  if(quando < ora + (diretto ? 0.08 : 0.25) || quando > ora + 3.0) quando = ora + cuscino;
  try{ s.start(quando); suonate++; }catch(e){}

}
/* L ASCOLTO E IL TESTO SONO DUE COSE DIVERSE.
   Il collegamento con la telefonata si apre da solo appena c e una linea viva:
   e quello che porta le parole da scrivere. Il tasto decide soltanto se
   l audio esce dalle cuffie. Prima erano la stessa cosa, e spegnendo l audio
   si spegneva anche la conversazione scritta. */
async function accendiAscolto(c){
  if(audioConv === c && audioWs && audioWs.readyState <= 1) return true;
  let j;
  try{
    const r = await fetch(API + '-ascolta?cosa=avvia&c=' + encodeURIComponent(c) + '&t=' + encodeURIComponent(PASS));
    j = await r.json();
  }catch(e){ return false; }
  if(!j || !j.ok){ if(!j || j.errore !== 'telefonata gia chiusa') avvisa(j && j.errore ? j.errore : 'collegamento non disponibile'); return false; }
  quando = 0;
  try{ if(audioWs) audioWs.close(); }catch(e){}
  audioConv = c;
  /* IL CANALE DIRETTO. Fino a ieri la voce faceva questo giro: orecchio ->
     una richiesta HTTP nuova ogni 240 ms verso il Realtime di Supabase ->
     la vecchia edge regia-audio in ascolto -> questa pagina. Tre salti, e la
     edge in mezzo veniva spenta ogni centocinquanta secondi con un riaggancio:
     di qui i buchi e gli scatti. Adesso, se l orecchio offre il suo indirizzo,
     ci si attacca a lui e basta: un collegamento solo, che dura quanto la
     telefonata. Se non lo offre - orecchio vecchio, o server irraggiungibile -
     si torna al giro di prima senza dire niente a nessuno. */
  const dove = j.diretto || (API.replace(/^http/,'ws') + '-audio?ascolta=1&conv=' + encodeURIComponent(c) + '&t=' + encodeURIComponent(PASS));
  diretto = Boolean(j.diretto);
  audioWs = new WebSocket(dove);
  audioWs.onmessage = function(e){
    var m; try{ m = JSON.parse(e.data); }catch(x){ return; }
    if(m.tipo === 'parola' && m.testo){
      if(parlatoConv !== c){ parlatoConv = c; parlato = []; corso = {}; }
      if(m.finita){ parlato.push({chi:m.chi, testo:m.testo}); corso[m.chi] = ''; }
      else { corso[m.chi] = m.testo; }
      if(parlato.length > 120) parlato = parlato.slice(-120);
      dipingiParlato();
      return;
    }
    if(m.tipo === 'audio' && (m.cliente || m.valentino)){
      fette++;
      suona(m);
      /* IL CONTATORE NON STA PIU DENTRO IL TASTO. Scriveva li dentro fette e
         pezzi suonati quattro volte al secondo: il testo cambiava, il tasto
         cambiava larghezza, e chi voleva premerlo si trovava il bersaglio che
         si muoveva sotto il dito - bisognava insistere, o prenderlo di lato.
         Il conto serviva a me per capire se l audio scorreva, non a chi lavora:
         adesso sta nel suggerimento che compare passandoci sopra. */
      const b = document.getElementById('bAsc');
      if(b) b.title = 'fette ricevute ' + fette + ', suonate ' + suonate + (diretto ? ' - canale diretto' : ' - giro lungo');
    }
  };
  audioWs.onclose = function(){
    if(audioConv !== c) return;
    audioConv = null;
    /* Il nastro verso la pagina vive dentro una funzione Supabase, che il
       sistema spegne dopo centocinquanta secondi. Si riapre SEMPRE finche la
       telefonata e in linea, non solo con l audio acceso: prima era legato al
       tasto, ed e per questo che spegnendo l audio moriva anche il resto. */
    const ancoraViva = stato.vive.some(function(x){ return x.conversazione === c; });
    if(ancoraViva){
      const b = document.getElementById('bAsc');
      if(b && muto) b.innerHTML = '<span class="led"></span>Riaggancio&hellip;';
      setTimeout(function(){ accendiAscolto(c); }, 800);
    }
  };
  return true;
}

/* il modulo compilato sui social: "Domanda?: risposta | Domanda?: risposta".
   La domanda resta testo, la risposta - il dato - va in grassetto: cosi in un
   colpo d occhio si leggono 6 kw, si, entro tre mesi, senza rileggere tutto. */
function chiesto(t){
  const parti = String(t||'').split('|').map(x=>x.trim()).filter(Boolean);
  if(!parti.length) return '<p class="attesa">Nessun modulo collegato.</p>';
  return '<div class="chiesto">'+parti.map(p=>{
    let d = '', r = '';
    const m = p.match(/^(.*?\?)\s*:\s*([\s\S]*)$/);
    if(m){ d = m[1]; r = m[2]; }
    else { const i = p.indexOf(':'); if(i > 0){ d = p.slice(0,i); r = p.slice(i+1); } else { r = p; } }
    d = d.replace(/\s*\?\s*$/,'').trim(); r = r.trim();
    if(!r) return '';
    return '<div class="cq">'+(d? '<span>'+esc(d)+'</span>':'')+'<b>'+esc(r)+'</b></div>';
  }).join('')+'</div>';
}

async function accendiVoce(velo){
  if(vocePronta){ spegniVoce(); return; }

    j = await r.json();
  }catch(e){ fVoceStato(velo, 'non riesco a chiedere il collegamento', false); return; }

  const ws = new WebSocket(j.url);

     bisogna ZITTIRLI: l audio schedulato continua a suonare per conto suo anche
     dopo che ElevenLabs ha detto all agente di tacere, e mentre quello finisce
     arriva la risposta nuova - ed e cosi che si sentono due Valentino insieme. */
  /* UNA VOCE SOLA, PER COSTRUZIONE.
     Prima i pezzi di voce si programmavano a orario: si calcolava quando far
     partire ognuno e si lasciava fare all orologio. Basta un conto sbagliato,
     una risposta che si accavalla a quella di prima, un ritardo di rete, e due
     pezzi partono insieme: si sentono due Valentino. Adesso c e una coda e un
     solo pezzo che suona per volta: quando finisce parte il successivo, e
     finche uno suona nessun altro puo partire. Non e una taratura piu fine, e
     un impedimento: due voci insieme non sono piu possibili.
     Quando lo si interrompe si butta via la coda e si ferma quello in bocca. */
  let coda = [], sta = null;
  function accoda(buf){

  function partiIlProssimo(){

      src.buffer = buf;

       nessuno. Adesso quando il collegamento si chiude, comunque si chiuda,

       tre formazioni e l elenco diventa illeggibile. Si mostra una riga sola -
       la sintesi se c e, se no l inizio di quello che ci si e detti - e il piu
       apre tutto per chi vuole rileggere. */
    const corto = (s, n) => { s = String(s||'').replace(/\s+/g,' ').trim(); return s.length > n ? s.slice(0, n) + '...' : s; };
    d.innerHTML = l.length
      ? l.map(x=>{
          const intero = String(x.detto || '');
          const riga = x.regola ? String(x.regola) : intero;
          const lungo = intero.length > 220;
          return '<div class="flez'+(appena && String(x.id) === String(appena) ? ' appena' : '')+'">'+
            '<span class="fstato '+esc(x.stato||'')+'">'+esc(x.stato||'')+'</span>'+
            '<div class="flez-corpo">'+
              '<p>'+esc(corto(riga, 200))+'</p>'+
              (lungo? '<div class="flez-tutto" hidden>'+esc(intero)+'</div>':'')+
              '<time>'+esc(String(x.quando||'').slice(0,16).replace('T',' '))+
              (appena && String(x.id) === String(appena) ? ' &middot; appena messa via' : '')+
              (lungo? ' &middot; '+Math.round(intero.length/1000)+' mila caratteri' : '')+'</time>'+
            '</div>'+
            (lungo? '<button class="flez-piu" data-apri="'+esc(String(x.id))+'" title="leggi tutto">+</button>' : '')+
          '</div>';
        }).join('')
      : '<p class="attesa">Ancora nessun insegnamento.</p>';
    d.querySelectorAll('[data-apri]').forEach(b => b.onclick = () => {
      const riga = b.closest('.flez');
      const tutto = riga && riga.querySelector('.flez-tutto');
      if(!tutto) return;
      tutto.hidden = !tutto.hidden;
      b.textContent = tutto.hidden ? '+' : '−';
      riga.classList.toggle('aperta', !tutto.hidden);
    });
    /* si scorre il pannello fin dove sta: il blocco Gia insegnato e in fondo, e
       con una conversazione lunga sopra finisce fuori dalla finestra - senza
       questo uno chiude, non vede niente e crede di aver perso tutto */
    const nuova = d.querySelector('.flez.appena');
    if(nuova){ try{ nuova.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){ nuova.scrollIntoView(); } }
  }catch(e){ d.innerHTML = '<p class="attesa">Non riesco a leggere l elenco.</p>'; }
}
async function mandaFormazione(velo, conv){
  const ta = velo.querySelector('#fTesto');
  const es = velo.querySelector('#fEsito');
  const scritto = ((ta && ta.value) || '').trim();
  /* MANDA QUELLO CHE C E. Se ha parlato con l allievo, quello che conta e la
     conversazione: e il gesto naturale premere Manda dopo aver parlato, e non
     deve dipendere dal fatto che l allievo si ricordi di depositarla da solo.
     Il riquadro scritto resta per chi preferisce scrivere, o si somma. */
  const aVoce = voceBattute.length
    ? voceBattute.map(function(b){ return (b.chi === 'io' ? 'SANTE: ' : 'ALLIEVO: ') + b.testo; }).join('\n')
    : '';
  const t = [aVoce, scritto ? (aVoce ? '\n\nAGGIUNTO PER ISCRITTO:\n' + scritto : scritto) : ''].filter(Boolean).join('');
  if(t.length < 8){
    if(es) es.innerHTML = '<p class="attesa">Non c e ancora niente da mandare: parli con l allievo, oppure scriva qui sotto.</p>';
    return;
  }
  if(es) es.innerHTML = '<p class="attesa">Sto mettendo via&hellip;</p>';
  try{
    const r = await fetch(API.replace(/regia$/,'formazione'), {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({pass: PASS, conversazione_testo: t, conversazione: conv, chi: CHI, agente: 'valentino'})});
    const j = await r.json();
    if(!j || !j.ok){ if(es) es.innerHTML = '<p class="attesa">'+esc((j && j.errore) || 'non ci sono riuscito')+'</p>'; return; }
    if(es) es.innerHTML =
      (j.risposta? '<p class="frisp">'+esc(j.risposta)+'</p>':'')+
      '<p class="fattesa">Messa via come lezione '+(j.id? '#'+esc(String(j.id)):'')+'. Nel prompt di Valentino non entra niente: '+
      'lo guardiamo insieme quando apre la sessione.</p>';
    if(ta) ta.value = '';
    voceBattute = [];
    /* lo si dice anche in alto, dove sta guardando: in fondo al pannello
       potrebbe non arrivarci con l occhio */
    fVoceStato(velo, j.id ? ('messa via come lezione numero ' + j.id + ' - la trova qui sotto') : 'messa via', false);
    elencoFormazione(velo, j.id);
  }catch(e){ if(es) es.innerHTML = '<p class="attesa">non ci sono riuscito</p>'; }
}
function dettaFormazione(velo){
  const b = velo.querySelector('#fDetta');
  const ta = velo.querySelector('#fTesto');
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!R){ if(ta) ta.placeholder = 'questo browser non sa ascoltare: scriva pure'; return; }
  if(riconF){ try{ riconF.stop(); }catch(e){} riconF = null; if(b) b.setAttribute('aria-pressed','false'); return; }
  riconF = new R();
  riconF.lang = 'it-IT'; riconF.interimResults = true; riconF.continuous = true;
  const prima = ((ta && ta.value) || '').trim();
  riconF.onresult = (e) => {
    let t = '';
    for(let k=0;k<e.results.length;k++) t += e.results[k][0].transcript;
    if(ta) ta.value = (prima? prima+' ' : '')+t;
  };
  riconF.onend = () => { riconF = null; const bb = velo.querySelector('#fDetta'); if(bb) bb.setAttribute('aria-pressed','false'); };
  riconF.onerror = () => { riconF = null; const bb = velo.querySelector('#fDetta'); if(bb) bb.setAttribute('aria-pressed','false'); };
  try{ riconF.start(); if(b) b.setAttribute('aria-pressed','true'); }catch(e){}
}

    b.disabled = true;
    try{ await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({t: PASS, richiamo_fatto: b.dataset.fatto})}); }catch(e){}
    tira();
  });
  /* SPOSTA: apre il datario su quella riga. La pagina si ridisegna ogni tre
     secondi, quindi quale datario e aperto va ricordato fuori dal disegno,
     se no si richiude da solo mentre uno sta scegliendo l ora. */
  document.querySelectorAll('#corpoRich [data-sposta]').forEach(b => b.onclick = () => {
    datarioAperto = (datarioAperto === b.dataset.sposta) ? null : b.dataset.sposta;
    annullaChiesto = null;
    disegna();
  });
  document.querySelectorAll('#corpoRich [data-conferma]').forEach(b => b.onclick = async () => {
    const id = b.dataset.conferma;
    const campo = document.querySelector('#corpoRich [data-quando="'+id+'"]');
    const v = campo && campo.value;
    if(!v) return;
    b.disabled = true;
    try{
      await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({t: PASS, richiamo_sposta: id, quando: v})});
    }catch(e){}
    datarioAperto = null;
    tira();
  });
  /* CANCELLA: due tocchi. Il primo chiede conferma sul tasto stesso, il secondo
     toglie il richiamo. Non e la stessa cosa di Fatto: qui resta scritto che
     nessuno ha telefonato, ed e la differenza che conta rileggendo lo storico. */
  document.querySelectorAll('#corpoRich [data-annulla]').forEach(b => b.onclick = async () => {
    const id = b.dataset.annulla;
    if(annullaChiesto !== id){ annullaChiesto = id; datarioAperto = null; disegna(); setTimeout(function(){ if(annullaChiesto === id){ annullaChiesto = null; disegna(); } }, 6000); return; }
    annullaChiesto = null;
    b.disabled = true;
    try{
      await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({t: PASS, richiamo_annulla: id, motivo: 'tolto dalla regia da ' + (CHI || 'chi era in regia')})});
    }catch(e){}
    tira();
  });
  document.querySelectorAll('#corpoRich [data-chiama]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'sto chiamando...';
    try{
      const r = await fetch(API + '-chiama', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({t: PASS, telefono: b.dataset.chiama})});
      const j = await r.json();
      b.textContent = (j && j.ok) ? 'sta squillando' : 'non parte';
    }catch(e){ b.textContent = 'non parte'; }
    setTimeout(tira, 2500);
  });

  /* la tabella dello storico si ridisegna solo quando cambia davvero:
     con quattrocento righe, rifarla ogni tre secondi inchioda la pagina */
  const firma = periodo + '|' + stato.chiuse.length + '|' + (stato.chiuse[0] ? stato.chiuse[0].id : '');
  if(firma !== firmaChiuse){
  firmaChiuse = firma;
  $('corpoChiuse').innerHTML = stato.chiuse.length ? stato.chiuse.map(c =>
    '<tr><td class="nomeCell">'+(c.chiamante
        ? '<button class="tastoNome" data-tel="'+esc(c.chiamante)+'">'+esc(Nome(c.chi)||c.chiamante)+'</button>'
        : esc(Nome(c.chi)||''))+'</td>'+
    '<td class="num">'+esc((c.quando||'').slice(0,16).replace('T',' '))+'</td>'+
    '<td class="num">'+mmss(c.durata_sec||0)+'</td>'+
    '<td>'+esc(corto(c.di_cosa,220))+'</td>'+
    '<td class="ascCell">'+(c.audio
        ? '<audio controls preload="none" src="'+esc(c.audio)+'"></audio>'+
          '<a class="apri" href="'+esc(c.audio)+'" target="_blank" rel="noopener" title="apri in una scheda a parte">apri</a>'
        : '-')+'</td></tr>').join('')
    : '<tr><td colspan="5" style="color:var(--ink-3)">Nessuna telefonata in questo periodo.</td></tr>';
  document.querySelectorAll('.tastoNome').forEach(b => b.onclick = () => apriCliente(b.dataset.tel));
  $('sottoChiuse').textContent = stato.chiuse.length + ' telefonate';
  }
}
/* ---- la scheda del cliente, aperta cliccando il suo nome ---- */
async function apriCliente(tel){
  if(!tel) return;
  let d;
  try{
    const r = await fetch(API + '?cliente=' + encodeURIComponent(tel) + '&t=' + encodeURIComponent(PASS));
    d = await r.json();
  }catch(e){ return; }
  const s = d.scheda || {}, t = s.tetto || {}, voci = s.voci || null;
  const tel_ = d.telefonate || [];
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML =
    '<div class="pannello">'+
      '<div class="testa"><div><h2>'+esc(Nome(d.nome)||tel)+'</h2>'+
        '<p>'+esc(tel)+(d.dove? ' &middot; '+esc(d.dove):'')+' &middot; '+(d.quante||0)+' telefonate</p></div>'+
        '<button class="via" aria-label="chiudi">&times;</button></div>'+
      (s.sintesi? '<div class="blocco"><p class="etich">Chi e</p><p class="sintesi">'+esc(s.sintesi)+'</p></div>':'')+
      '<div class="blocco"><p class="etich">Cosa ha chiesto</p>'+chiesto(s.cosa_ha_risposto)+'</div>'+
      '<div class="blocco"><p class="etich">Il tetto</p>'+
        (t.vincoli? '<div class="esitov '+(t.semaforo==="verde"?"ok":t.semaforo==="rosso"?"no":"att")+'">'+esc(t.vincoli)+'</div>':'')+
        righe([['Falde',t.falde],['Esposizione',t.inclinazione],['Ci stanno',t.moduli],['Potenza',t.potenza],['Produzione',t.produzione],['Verificato',t.verificato||t.analizzato]])+'</div>'+
      '<div class="blocco"><p class="etich">Quello che ha detto</p>'+
        righe([['Bolletta',s.bolletta],['Consumo stimato',s.consumo],['In casa',s.persone],['Di giorno',s.giorno],['Riscaldamento',s.riscaldamento],['Contatore',s.contatore],['Auto',s.auto],['Sul tavolo',s.prezzo]])+'</div>'+
      (voci? '<div class="blocco"><p class="etich">Le voci trovate</p>'+righe(Object.entries(voci))+'</div>':'')+
      '<div class="blocco"><p class="etich">Come e andata, volta per volta</p></div>'+
      (tel_.length? tel_.map(x =>
        '<div class="tel-riga"><div class="tel-capo">'+
          '<span class="spia '+esc(x.livello||"verde")+'"></span>'+
          '<time>'+esc((x.quando||"").slice(0,16).replace("T"," "))+'</time>'+
          '<span>'+esc(x.flash||"")+'</span>'+
          '<span class="dur">'+mmss(x.secondi||0)+'</span></div>'+
        ((x.momenti&&x.momenti.length)? '<ul class="tel-mom">'+x.momenti.map(m=>'<li><time>'+esc(m.ora)+'</time>'+esc(m.cosa)+'</li>').join('')+'</ul>':'')+
        '<div style="margin-top:9px"><audio controls preload="none" src="'+esc(API+"-registrazione?c="+encodeURIComponent(x.conversazione)+"&t="+encodeURIComponent(PASS))+'"></audio></div>'+
        '</div>').join('') : '<p class="vuoto">Nessuna telefonata registrata.</p>')+
    '</div>';
  velo.onclick = (e) => { if(e.target === velo || e.target.classList.contains('via')) velo.remove(); };
  document.body.appendChild(velo);
}

document.querySelectorAll('.per').forEach(b => b.onclick = () => {
  periodo = b.dataset.p;
  firmaChiuse = '';
  document.querySelectorAll('.per').forEach(x => x.setAttribute('aria-pressed', x===b));
  tira();
});
function scheda(q){
  ['tLinea','tArric','tRich','tChiuse'].forEach(k => $(k).setAttribute('aria-selected', k===q));
  $('vLinea').classList.toggle('nascosto', q!=='tLinea');
  $('vArric').classList.toggle('nascosto', q!=='tArric');
  $('vRich').classList.toggle('nascosto', q!=='tRich');
  $('vChiuse').classList.toggle('nascosto', q!=='tChiuse');
}
$('bTema').onclick = () => tema(document.documentElement.getAttribute('data-tema') === 'chiaro' ? 'scuro' : 'chiaro');
$('bPieno').onclick = () => schermoPieno();
$('tLinea').onclick = () => scheda('tLinea');
$('tArric').onclick = () => scheda('tArric');
$('tRich').onclick = () => scheda('tRich');
$('tChiuse').onclick = () => scheda('tChiuse');

})();
