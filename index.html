<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regia - Next</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--ground:#100E0C;--surface:#1A1613;--surface-2:#231D19;--surface-3:#2C251F;--ink:#F2EBE3;--ink-2:#AFA49A;--ink-3:#7C716A;--line:#332B25;--line-2:#453A32;--amber:#E2A24C;--amber-dim:#7A5622;--amber-wash:#241A0E;--sage:#7FB08B;--sage-dim:#22321F;--brick:#CE6A45;--brick-dim:#3A1F16;--display:"Bricolage Grotesque",Arial,sans-serif;--sans:"IBM Plex Sans",Arial,sans-serif;--mono:"IBM Plex Mono",Menlo,monospace}
:root[data-tema="chiaro"]{--ground:#F7F4EF;--surface:#FFFFFF;--surface-2:#F1ECE4;--surface-3:#E7E1D6;--ink:#1C1815;--ink-2:#574E47;--ink-3:#8A8078;--line:#E2DBD1;--line-2:#CDC3B6;--amber:#8A5C12;--amber-dim:#F2E3C8;--amber-wash:#FBF4E6;--sage:#2F6B41;--sage-dim:#E3F0E5;--brick:#A8401C;--brick-dim:#FAE2D8}
:root[data-tema="chiaro"] .porta button{color:#3A2A0C}
:root[data-tema="chiaro"] .nastro{color:#4A3208}
:root[data-tema="chiaro"] .nastro b{color:#2E1F04}
:root[data-tema="chiaro"] .tasto[aria-pressed=true]{color:#3A2A0C}
:root[data-tema="chiaro"] .tasto.entra[aria-pressed=true]{color:#1C4426}
:root[data-tema="chiaro"] .tasto.chiudi:hover{color:#6E2610}
:root[data-tema="chiaro"] .esitov.ok,:root[data-tema="chiaro"] .vincoli.ok{color:#1C4426}
:root[data-tema="chiaro"] .esitov.att,:root[data-tema="chiaro"] .vincoli.att{color:#5A3D06}
:root[data-tema="chiaro"] .esitov.no,:root[data-tema="chiaro"] .vincoli.no{color:#6E2610}
:root[data-tema="chiaro"] .banda.rosso,:root[data-tema="chiaro"] .banda.giallo,:root[data-tema="chiaro"] .banda.verde{color:var(--ink)}
.tema{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;padding:2px 8px;opacity:.85}
.tema:hover{opacity:1}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}a{color:inherit}
.porta{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.porta form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.porta h1{font-family:var(--display);font-weight:800;font-size:30px;margin:0;letter-spacing:-.02em}
.porta p{margin:0;color:var(--ink-2);font-size:14.5px}
.porta input{background:var(--surface);border:1px solid var(--line-2);color:var(--ink);padding:13px 14px;font:inherit;font-family:var(--mono)}
.porta input:focus{outline:2px solid var(--amber);outline-offset:1px}
.porta button{background:var(--amber-dim);color:#FBE9CF;padding:13px;font-weight:600;border:1px solid var(--amber)}
.porta .no{color:var(--brick);font-size:13.5px;min-height:20px;margin:0}
.nastro{background:var(--amber-dim);color:#F6DFBE;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:7px 20px;display:flex;gap:18px;flex-wrap:wrap}
.nastro b{color:#FFF3E2;font-weight:500}
.schede{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 20px;flex-wrap:wrap}
.st{padding:12px 16px;font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.st[aria-selected=true]{color:var(--amber);border-bottom-color:var(--amber)}
.st.urgente{color:var(--brick)}
.st.urgente span{background:var(--brick);color:#fff;border-radius:8px;padding:1px 6px;margin-left:3px}
.rich{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:start;background:var(--surface);border:1px solid var(--line);padding:14px 16px;margin-bottom:10px}
.rich-quando b{display:block;font-family:var(--mono);font-size:17px}
.rich-quando span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.rich.adesso{border-color:var(--brick)}
.rich.adesso .rich-quando b{color:var(--brick)}
.rich.a-momenti{border-color:var(--amber)}
.rich.a-momenti .rich-quando b{color:var(--amber)}
.rich-chi .tastoNome{font-size:15px}
.rich-chi .sintesi{margin:5px 0 0}
.rich-fare{display:flex;gap:8px}
.rich-fare .tasto{padding:8px 12px;font-size:12.5px}
.nascosto{display:none!important}
.telaio{display:grid;grid-template-columns:298px minmax(0,1fr) 336px;gap:1px;background:var(--line);min-height:calc(100vh - 78px)}
.col{background:var(--ground);display:flex;flex-direction:column;min-width:0}
.titolo{padding:14px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between}
.titolo h2{font-family:var(--display);font-weight:600;font-size:14.5px;margin:0}
.conta{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.linee{overflow-y:auto}
.linea{width:100%;text-align:left;display:grid;grid-template-columns:9px 1fr;gap:11px;padding:13px 17px;border-bottom:1px solid var(--line)}
.linea:hover{background:var(--surface)}
.linea[aria-current=true]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--amber)}
.linea.spenta{cursor:default}.linea.spenta:hover{background:none}
.linea.spenta .spia{background:var(--line-2)}
.spia{width:9px;height:9px;border-radius:50%;margin-top:5px}
.spia.rosso{background:var(--brick);animation:p 1.3s infinite}.spia.giallo{background:var(--amber)}.spia.verde{background:var(--sage)}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
@media(prefers-reduced-motion:reduce){.spia.rosso{animation:none}}
.l-nome{font-weight:600;font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-dati{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:block;margin-top:2px}
.l-dati b{font-weight:400;color:var(--ink-2);font-variant-numeric:tabular-nums}
.l-flash{font-size:12.5px;margin-top:6px;line-height:1.35;display:block}
.l-flash.rosso{color:var(--brick)}.l-flash.giallo{color:var(--amber)}.l-flash.verde{color:var(--sage)}
.onda{display:flex;gap:2px;align-items:flex-end;height:13px;margin-top:7px}
.onda i{width:2px;background:var(--ink-3);opacity:.5;height:3px;animation:vibra 1s infinite ease-in-out}
.linea[aria-current=true] .onda i{background:var(--amber);opacity:.85}
.onda i:nth-child(1){animation-delay:0s}.onda i:nth-child(2){animation-delay:.12s}.onda i:nth-child(3){animation-delay:.24s}
.onda i:nth-child(4){animation-delay:.36s}.onda i:nth-child(5){animation-delay:.18s}.onda i:nth-child(6){animation-delay:.3s}
@keyframes vibra{0%,100%{height:3px}50%{height:13px}}
@media(prefers-reduced-motion:reduce){.onda i{animation:none;height:7px}}
.banda{display:flex;gap:13px;align-items:flex-start;padding:15px 20px;border-bottom:1px solid var(--line)}
.banda .bollo{width:13px;height:13px;border-radius:50%;margin-top:4px;flex:none}
.banda.rosso{background:var(--brick-dim)}.banda.rosso .bollo{background:var(--brick)}
.banda.giallo{background:var(--amber-wash)}.banda.giallo .bollo{background:var(--amber)}
.banda.verde{background:var(--sage-dim)}.banda.verde .bollo{background:var(--sage)}
.banda.spenta{background:var(--surface)}.banda.spenta .bollo{background:var(--line-2)}
.banda.spenta h3{color:var(--ink-2)}
.spento{color:var(--ink-3)}
.parlato .et{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.tasto[disabled]{opacity:.45;cursor:default}
.tasto em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-left:5px}
.suggerisci input[disabled],.suggerisci button[disabled]{opacity:.45;cursor:default}
.banda h3{font-family:var(--display);font-weight:800;font-size:16.5px;margin:0 0 3px}
.banda p{margin:0;font-size:13.5px;color:var(--ink-2)}
.banda .quando{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto;white-space:nowrap;padding-top:4px}
.capo{padding:17px 20px 14px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.capo h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
.capo .sotto{font-family:var(--mono);font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:14px}
.grosso{font-family:var(--mono);font-size:28px;font-variant-numeric:tabular-nums;line-height:1;text-align:right;min-width:5ch;font-feature-settings:"tnum" 1}
.grosso small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.flusso{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-height:150px}
.evento{display:grid;grid-template-columns:52px 10px 1fr;gap:12px;align-items:start}
.evento time{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);padding-top:2px;font-variant-numeric:tabular-nums}
.evento .pallo{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--ink-3)}
.evento.rosso .pallo{background:var(--brick)}.evento.giallo .pallo{background:var(--amber)}.evento.verde .pallo{background:var(--sage)}
.evento p{margin:0;font-size:14px}
.dett{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:baseline}
.dett .chi{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding-top:3px}
.dett.cliente .chi{color:#79A6C4}
.dett.valentino .chi{color:var(--amber)}
.dett p{margin:0;max-width:62ch}
.dett.valentino p{color:var(--ink-2)}
.evento.rosso p{color:var(--brick)}
.vuoto{color:var(--ink-3);font-size:14px;padding:34px 20px;text-align:center;line-height:1.6}
.scia{border-top:1px solid var(--line);background:var(--surface-2);padding:11px 20px 12px;display:flex;align-items:baseline;gap:16px}
.scia-et{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.scia-righe{display:flex;overflow-x:auto;padding-bottom:2px}
.tappa{display:flex;align-items:baseline;gap:7px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;padding:0 14px;border-left:1px solid var(--line-2)}
.tappa:first-child{padding-left:0;border-left:none}
.tappa time{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.tappa.ora,.tappa.ora time{color:var(--amber)}
.banco{border-top:1px solid var(--line);background:var(--surface);padding:13px 20px;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.tasto{display:inline-flex;align-items:center;gap:9px;padding:10px 15px;border:1px solid var(--line-2);background:var(--surface-2);font-size:13.5px;font-weight:500;text-decoration:none}
.tasto:hover{border-color:var(--ink-3);background:var(--surface-3)}
.tasto .led{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.tasto[aria-pressed=true]{border-color:var(--amber);background:var(--amber-dim);color:#FBE9CF}
.tasto[aria-pressed=true] .led{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.tasto.entra[aria-pressed=true]{border-color:var(--sage);background:var(--sage-dim);color:#DCEFE0}
.tasto.entra[aria-pressed=true] .led{background:var(--sage);box-shadow:0 0 6px var(--sage)}
.tasto.prendi{margin-left:auto}
.tasto.prendi[data-stato=squilla]{border-color:var(--sage);background:var(--sage-dim);animation:p 1s infinite}
.tasto.prendi[data-stato=in-linea]{border-color:var(--brick);background:var(--brick-dim)}
.tasto.prendi[data-stato=attesa]{opacity:.6}
.tasto.prendi[data-stato=guasto]{border-color:var(--brick-dim);color:var(--ink-3)}
.tasto.chiudi{border-color:var(--brick-dim);color:var(--brick)}
.tasto.chiudi:hover{border-color:var(--brick);background:var(--brick-dim);color:#F6D9CC}
.avviso{padding:9px 20px;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;display:flex;gap:9px;align-items:center;border-top:1px solid var(--line)}
.avviso .pt{width:7px;height:7px;border-radius:50%;background:currentColor}
.parlato{flex:1;min-height:220px;overflow-y:auto;padding:16px 20px 18px;background:var(--ground)}
.parlato .bt{font-size:15px}
.salienti{border-bottom:1px solid var(--line);background:var(--surface);padding:12px 20px 13px;max-height:140px;overflow-y:auto}
.salienti .et{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.sal-righe{display:flex;flex-direction:column;gap:5px}
.sal{display:grid;grid-template-columns:46px 1fr;gap:10px;font-size:13px;line-height:1.4;padding-left:9px;border-left:2px solid var(--line-2)}
.sal time{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.sal.rosso{border-left-color:var(--brick)}.sal.rosso span{color:var(--brick)}
.sal.giallo{border-left-color:var(--amber)}
.sal.verde{border-left-color:var(--sage)}
.vincoli{display:flex;gap:11px;align-items:flex-start;padding:13px 17px;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.45}
.vincoli .bollo{width:12px;height:12px;border-radius:50%;margin-top:3px;flex:none;background:var(--ink-3)}
.vincoli.ok{background:var(--sage-dim);color:#CFE6D5}.vincoli.ok .bollo{background:var(--sage)}
.vincoli.att{background:var(--amber-wash);color:#F3DDBB}.vincoli.att .bollo{background:var(--amber)}
.vincoli.no{background:var(--brick-dim);color:#F2D2C6}.vincoli.no .bollo{background:var(--brick)}
.vincoli b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;opacity:.8;margin-bottom:3px;font-weight:500}
.parlato .et{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px;display:flex;gap:9px;align-items:center}
.parlato .et .vivo{width:7px;height:7px;border-radius:50%;background:var(--sage);animation:p 1.3s infinite}
.bt{display:grid;grid-template-columns:74px 1fr;gap:10px;padding:3px 0;font-size:13.5px;line-height:1.45}
.bt .chi{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding-top:3px}
.bt.cliente .chi{color:var(--amber)}
.bt.valentino .chi{color:var(--sage)}
.bt.corso{opacity:.6;font-style:italic}
.suggerisci{display:flex;gap:8px;padding:11px 20px;border-top:1px solid var(--line);background:var(--surface-2)}
.suggerisci input{flex:1;background:var(--ground);border:1px solid var(--line-2);color:var(--ink);padding:10px 12px;font:inherit;font-size:13.5px}
.suggerisci input:focus{outline:2px solid var(--amber);outline-offset:1px}
.suggerisci button{border:1px solid var(--line-2);background:var(--surface-3);padding:0 14px;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;min-width:44px}
.suggerisci button svg{display:block}
.suggerisci button.dett[aria-pressed=true]{border-color:var(--brick);background:var(--brick-dim);color:#F6D9CC}
.detto{padding:0 20px 10px;font-size:12.5px;color:var(--sage);background:var(--surface-2)}
.avviso.muto{background:var(--surface-2);color:var(--ink-2)}
.avviso.tre{background:var(--sage-dim);color:var(--sage)}
.dx{overflow-y:auto}
.blocco{padding:15px 17px;border-bottom:1px solid var(--line)}
.blocco:last-child{border-bottom:none}
.etich{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.sintesi{margin:0;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.coppia{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13.5px;border-bottom:1px dotted var(--line)}
.coppia:last-child{border-bottom:none}.coppia dt{color:var(--ink-3)}
.coppia dd{margin:0;text-align:right;font-family:var(--mono);font-size:12.5px}
dl{margin:0}
.esitov{display:flex;gap:9px;font-size:13.5px;padding:9px 11px;line-height:1.45}
.esitov.ok{background:var(--sage-dim);color:#CFE6D5}
.esitov.att{background:var(--amber-wash);color:#F3DDBB}
.esitov.no{background:var(--brick-dim);color:#F2D2C6}
.offerta{background:var(--surface-2);padding:12px 13px}
.offerta .prezzo{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:-.02em;line-height:1}
.offerta .righe{font-size:12.5px;color:var(--ink-2);margin-top:7px;line-height:1.55}
.attesa{font-size:13px;color:var(--ink-3);font-style:italic;margin:0}
.foglio{max-width:1400px;margin:0 auto;padding:26px 20px 60px}
.tabella td.nomeCell{white-space:nowrap}
.tastoNome{font:inherit;font-weight:600;color:var(--amber);border-bottom:1px dotted var(--amber-dim);padding:0}
.tastoNome:hover{border-bottom-style:solid}
.velo{position:fixed;inset:0;background:rgba(8,6,5,.72);display:flex;justify-content:flex-end;z-index:50}
.pannello{width:min(560px,100%);background:var(--ground);border-left:1px solid var(--line);overflow-y:auto}
.pannello .testa{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:15px 18px;display:flex;align-items:flex-start;gap:14px}
.pannello .testa h2{font-family:var(--display);font-weight:800;font-size:21px;margin:0 0 3px}
.pannello .testa p{margin:0;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.pannello .via{margin-left:auto;font-size:22px;line-height:1;color:var(--ink-3);padding:0 4px}
.tel-riga{border-bottom:1px solid var(--line);padding:13px 18px}
.tel-capo{display:flex;align-items:baseline;gap:10px;font-size:13.5px}
.tel-capo time{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.tel-capo .dur{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.tel-mom{margin:8px 0 0;padding:0 0 0 14px;border-left:1px solid var(--line-2);list-style:none}
.tel-mom li{font-size:12.5px;color:var(--ink-2);padding:2px 0}
.tel-mom li time{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-right:7px}
.foglio h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0 0 4px}
.occhio{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin:0 0 22px}
.carta{background:var(--surface);border:1px solid var(--line);padding:16px 17px;margin-bottom:13px}
.carta h4{font-family:var(--display);font-weight:600;font-size:15px;margin:0 0 9px}
.periodi{display:flex;gap:8px;margin-bottom:16px}
.per{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border:1px solid var(--line-2);color:var(--ink-3)}
.per[aria-pressed=true]{border-color:var(--amber);color:var(--amber)}
.tabella{width:100%;border-collapse:collapse;font-size:13.5px}
.tabella th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line-2)}
.tabella td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.avvolgi{overflow-x:auto;border:1px solid var(--line)}

<script src="https://sdk.twilio.com/js/voice/releases/2.11.0/twilio.min.js"></script>
<script>
/* se qualcosa si rompe, lo si vede: meglio un avviso brutto che una pagina
   che smette di funzionare senza dire perche */
window.onerror = function(m, f, r, c){
  try{
    let b = document.getElementById('guasto');
    if(!b){
      b = document.createElement('div');
      b.id = 'guasto';
      b.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99;background:#7A1E08;color:#FFE9E0;font:12px/1.5 monospace;padding:8px 12px;white-space:pre-wrap';
      document.body.appendChild(b);
    }
    b.textContent = 'guasto nella pagina: ' + m + '  (riga ' + r + ')';
  }catch(e){}
  return false;
};
const API = 'https://pnxhthrheqeucoisifjw.supabase.co/functions/v1/regia';
let PASS = sessionStorage.getItem('regia_pass') || '';
let CHI  = sessionStorage.getItem('regia_chi') || '';
let sel = null, stato = {vive:[], chiuse:[], richiami:[]}, avviato = false, periodo = 'oggi';
let muto = false, tre = false; let ws = null, wsConv = null, battute = [];

/* ---- ascolto in diretta: audio duplicato da Twilio, mu-law 8 kHz ---- */
const MU = (function(){
  const t = new Int16Array(256);
  for(let i=0;i<256;i++){
    const u = ~i & 0xFF;
    const segno = (u & 0x80) ? -1 : 1;
    const esp = (u >> 4) & 7;
    const man = u & 15;
    let v = ((man << 1) + 33) << esp;
    v -= 33;
    t[i] = segno * v * 4;
  }
  return t;
})();
let ctx = null, quando = 0, audioWs = null, audioConv = null, fette = 0, suonate = 0;
let parlato = [], corso = {}, parlatoConv = null, ricon = null, firmaChiuse = '';

/* la conversazione che si scrive mentre si parla */
function dipingiParlato(){
  const p = document.getElementById('parlato'); if(!p) return;
  const vivo = (audioWs && audioWs.readyState === 1);
  const inCorso = ['cliente','valentino'].filter(k => corso[k]).map(k =>
    '<div class="bt '+k+' corso"><span class="chi">'+(k==='cliente'?'Cliente':'Valentino')+'</span><span>'+esc(corso[k])+'</span></div>').join('');
  p.innerHTML =
    '<p class="et">'+(vivo?'<span class="vivo"></span>':'')+'Cosa si stanno dicendo</p>'+
    (parlato.length||inCorso
      ? parlato.map(b => '<div class="bt '+esc(b.chi)+'"><span class="chi">'+(b.chi==='cliente'?'Cliente':'Valentino')+'</span><span>'+esc(b.testo)+'</span></div>').join('') + inCorso
      : '<p class="attesa">'+(vivo?'In ascolto&hellip;':'Prema Ascolta in silenzio per sentire e leggere la conversazione.')+'</p>');
  p.scrollTop = p.scrollHeight;
}

/* ---- il telefono dentro la pagina ----------------------------------
   Quando si preme "prendo io", Twilio dirotta la telefonata viva qui:
   squillano le cuffie, il cliente resta in linea, Valentino esce. */
let apparecchio = null, inLinea = null, statoTel = 'spento';

function segnaTel(s, testo){
  statoTel = s;
  const b = document.getElementById('bPrendi');
  if(b){
    b.setAttribute('data-stato', s);
    if(testo) b.innerHTML = testo;
  }
}

async function accendiTelefono(){
  if(apparecchio || !window.Twilio || !Twilio.Device) return;
  let j;
  try{
    const r = await fetch(API + '-telefono?t=' + encodeURIComponent(PASS) + '&chi=' + encodeURIComponent((CHI||'regia').toLowerCase().replace(/[^a-z0-9]/g,'')||'regia'));
    j = await r.json();
  }catch(e){ return; }
  if(!j || !j.ok) return;
  try{
    apparecchio = new Twilio.Device(j.token, {codecPreferences:['opus','pcmu'], logLevel:'error'});
    apparecchio.on('registered', () => segnaTel('pronto'));
    apparecchio.on('error', () => segnaTel('guasto'));
    apparecchio.on('incoming', (c) => {
      inLinea = c;
      segnaTel('squilla', 'Rispondi');
      c.on('disconnect', () => { inLinea = null; segnaTel('pronto', 'Prendo io la chiamata'); });
      c.on('cancel',     () => { inLinea = null; segnaTel('pronto', 'Prendo io la chiamata'); });
      /* si risponde da soli: chi ha premuto il tasto sta gia aspettando */
      try{ c.accept(); segnaTel('in-linea', 'Chiudi e riattacca'); }catch(e){}
    });
    await apparecchio.register();
  }catch(e){ segnaTel('guasto'); }
}

async function prendiChiamata(c){
  if(inLinea){ try{ inLinea.disconnect(); }catch(e){} inLinea = null; segnaTel('pronto','Prendo io la chiamata'); return; }
  await accendiTelefono();
  if(statoTel === 'spento' || statoTel === 'guasto'){
    avvisa('il telefono nella pagina non parte');
    return;
  }
  segnaTel('attesa', 'Sto passando&hellip;');
  try{
    const r = await fetch(API + '-prendi', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({t: PASS, c: c,
        chi: (CHI||'regia').toLowerCase().replace(/[^a-z0-9]/g,'')||'regia',
        nome: CHI || ''})});
    const j = await r.json();
    if(!j || !j.ok){ segnaTel('pronto','Prendo io la chiamata'); avvisa(j && j.errore ? j.errore : 'non riesco a passarla'); }
    else { const d = document.getElementById('detto'); if(d) d.textContent = 'la sto passando a ' + (CHI || 'lei'); }
  }catch(e){ segnaTel('pronto','Prendo io la chiamata'); avvisa('non riesco a passarla'); }
}

/* il suggerimento: lo legge Valentino, il cliente non lo sente */
async function mandaSuggerimento(c){
  const i = document.getElementById('sugg'); if(!i) return;
  const t = (i.value||'').trim(); if(!t) return;
  i.value = '';
  const d = document.getElementById('detto');
  try{
    const r = await fetch(API.replace(/regia$/,'regia-suggerisci'), {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({t: PASS, c: c, testo: t, chi: CHI})});
    const j = await r.json();
    if(d) d.textContent = j && j.ok ? '→ ' + t : 'non sono riuscito a consegnarlo';
  }catch(e){ if(d) d.textContent = 'non sono riuscito a consegnarlo'; }
}

/* dettarlo invece di scriverlo */
function detta(){
  const b = document.getElementById('bDett');
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  const dove = document.getElementById('sugg');
  if(!R){ if(dove) dove.placeholder = 'questo browser non sa ascoltare: scriva pure'; return; }
  if(ricon){ try{ ricon.stop(); }catch(e){} ricon = null; if(b) b.setAttribute('aria-pressed','false'); return; }

  ricon = new R();
  ricon.lang = 'it-IT'; ricon.interimResults = true; ricon.continuous = true;
  ricon.onresult = (e) => {
    let t = '';
    for(let k=0;k<e.results.length;k++) t += e.results[k][0].transcript;
    /* si ripesca l elemento ogni volta: la pagina lo ricrea di continuo */
    const i = document.getElementById('sugg');
    if(i){ i.value = t; i.focus(); }
  };
  ricon.onend = () => {
    ricon = null;
    const bb = document.getElementById('bDett'); if(bb) bb.setAttribute('aria-pressed','false');
  };
  ricon.onerror = (e) => {
    ricon = null;
    const bb = document.getElementById('bDett'); if(bb) bb.setAttribute('aria-pressed','false');
    const i = document.getElementById('sugg');
    if(i && e && e.error === 'not-allowed') i.placeholder = 'il microfono e bloccato: lo consenta nel lucchetto accanto all indirizzo';
  };
  try{ ricon.start(); if(b) b.setAttribute('aria-pressed','true'); }catch(e){ ricon = null; }
}
function avvisa(t){
  try{
    const b = document.getElementById('bAsc'); if(!b) return;
    const v = b.innerHTML;
    b.innerHTML = '<span class="led"></span>' + t;
    setTimeout(function(){ b.innerHTML = v; }, 4000);
  }catch(e){}
}
/* mu-law verso numeri: la tabella si costruisce una volta sola.
   Il mescolamento delle due voci lo fa il computer di chi guarda: sul server
   costava la vita all orecchio, qui non si sente nemmeno. */
const MU = (function(){
  const t = new Float32Array(256);
  for(let i=0;i<256;i++){
    const u = ~i & 0xFF;
    const segno = (u & 0x80) ? -1 : 1;
    const esp = (u >> 4) & 7;
    const man = u & 15;
    let v = ((man << 1) + 33) << esp;
    v -= 33;
    t[i] = (segno * v * 4) / 32768;
  }
  return t;
})();

function suona(pezzi){
  if(!muto || !ctx || !pezzi) return;
  const a = pezzi.cliente || [], b = pezzi.valentino || [];
  if(!a.length && !b.length) return;
  /* i pacchetti arrivano come li manda Twilio: 160 byte ciascuno, 20 ms */
  const quanti = Math.max(a.length, b.length);
  const n = quanti * 160;
  const buf = ctx.createBuffer(1, n, 8000);
  const d = buf.getChannelData(0);
  for(let k=0;k<quanti;k++){
    let sa = null, sb = null;
    try{ if(a[k]) sa = atob(a[k]); }catch(e){}
    try{ if(b[k]) sb = atob(b[k]); }catch(e){}
    const base = k * 160;
    for(let i=0;i<160;i++){
      let v = 0;
      if(sa && i < sa.length) v += MU[sa.charCodeAt(i)];
      if(sb && i < sb.length) v += MU[sb.charCodeAt(i)];
      if(v > 1) v = 1; else if(v < -1) v = -1;
      d[base + i] = v;
    }
  }
  const s = ctx.createBufferSource();
  s.buffer = buf; s.connect(ctx.destination);
  const ora = ctx.currentTime;
  /* cuscinetto: se siamo in ritardo o troppo avanti, ci si riallinea */
  if(quando < ora + 0.10 || quando > ora + 2.0) quando = ora + 0.40;
  try{ s.start(quando); suonate++; }catch(e){}
  quando += buf.duration;
}
/* L ASCOLTO E IL TESTO SONO DUE COSE DIVERSE.
   Il collegamento con la telefonata si apre da solo appena c e una linea viva:
   e quello che porta le parole da scrivere. Il tasto decide soltanto se
   l audio esce dalle cuffie. Prima erano la stessa cosa, e spegnendo l audio
   si spegneva anche la conversazione scritta. */
async function accendiAscolto(c){
  if(audioConv === c && audioWs && audioWs.readyState <= 1) return true;
  let j;
  try{
    const r = await fetch(API + '-ascolta?cosa=avvia&c=' + encodeURIComponent(c) + '&t=' + encodeURIComponent(PASS));
    j = await r.json();
  }catch(e){ return false; }
  if(!j || !j.ok){ if(!j || j.errore !== 'telefonata gia chiusa') avvisa(j && j.errore ? j.errore : 'collegamento non disponibile'); return false; }
  quando = 0;
  try{ if(audioWs) audioWs.close(); }catch(e){}
  audioConv = c;
  audioWs = new WebSocket(API.replace(/^http/,'ws') + '-audio?ascolta=1&conv=' + encodeURIComponent(c) + '&t=' + encodeURIComponent(PASS));
  audioWs.onmessage = function(e){
    var m; try{ m = JSON.parse(e.data); }catch(x){ return; }
    if(m.tipo === 'parola' && m.testo){
      if(parlatoConv !== c){ parlatoConv = c; parlato = []; corso = {}; }
      if(m.finita){ parlato.push({chi:m.chi, testo:m.testo}); corso[m.chi] = ''; }
      else { corso[m.chi] = m.testo; }
      if(parlato.length > 120) parlato = parlato.slice(-120);
      dipingiParlato();
      return;
    }
    if(m.tipo === 'audio' && (m.cliente || m.valentino)){
      fette++;
      suona(m);
      const b = document.getElementById('bAsc');
      if(b) b.innerHTML = '<span class="led"></span>In ascolto &middot; ' + fette + '/' + suonate;
    }
  };
  audioWs.onclose = function(){
    if(audioConv !== c) return;
    audioConv = null;
    /* Il canale ha una vita massima: se cade mentre stiamo ancora
       ascoltando, si riapre da solo e si richiede il flusso a Twilio. */
    if(muto){
      const b = document.getElementById('bAsc');
      if(b) b.innerHTML = '<span class="led"></span>Riaggancio&hellip;';
      setTimeout(function(){ if(muto) accendiAscolto(c); }, 800);
    }
  };
  return true;
}
async function spegniAscolto(c){
  try{ if(audioWs) audioWs.close(); }catch(e){}
  audioWs = null; audioConv = null;
  try{ await fetch(API + '-ascolta?cosa=ferma&c=' + encodeURIComponent(c) + '&t=' + encodeURIComponent(PASS)); }catch(e){}
}
function ascolta(c){ /* la conversazione scritta arriva con la trascrizione, non piu di qui */ }
const $ = i => document.getElementById(i);
/* scura o chiara, come preferisce chi guarda */
function tema(v){
  document.documentElement.setAttribute('data-tema', v);
  try{ localStorage.setItem('regia_tema', v); }catch(e){}
  const b = document.getElementById('bTema');
  if(b) b.textContent = (v === 'chiaro') ? 'scura' : 'chiara';
}
(function(){
  let v = 'scuro';
  try{ v = localStorage.getItem('regia_tema') || 'scuro'; }catch(e){}
  tema(v);
})();
const mmss = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const esc = t => String(t==null?'':t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const corto = (t,n) => { t = String(t||''); return t.length>n ? t.slice(0,n-1)+'…' : t; };
/* i nomi arrivano tutti minuscoli dalle campagne: qui tornano presentabili */
const Nome = t => String(t||'').toLowerCase().replace(/(^|[\s'’\-])([a-zà-ÿ])/g, (m,a,b) => a + b.toUpperCase());
const orario = t => { try{ const d = new Date(t); const oggi = new Date().toDateString() === d.toDateString();
  return (oggi ? '' : d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'}) + ' ') +
    d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };

$('formPorta').addEventListener('submit', async (e) => {
  e.preventDefault(); $('no').textContent = '';
  try{
    const r = await fetch(API + '-entra', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({parola: $('parola').value})});
    const j = await r.json();
    if(!j.ok){ $('no').textContent = 'Parola non riconosciuta.'; $('parola').value=''; return; }
    PASS = j.pass; CHI = j.chi;
    sessionStorage.setItem('regia_pass', PASS); sessionStorage.setItem('regia_chi', CHI);
    apri();
  }catch(err){ $('no').textContent = 'Non riesco a raggiungere il sistema.'; }
});
function apri(){
  $('porta').classList.add('nascosto'); $('dentro').classList.remove('nascosto');
  $('chiSono').textContent = CHI ? 'ciao ' + CHI : '';
  if(!avviato){ avviato = true; tira(); setInterval(tira, 3000);
    setInterval(function(){ fetch(API + '-pulisci?t=' + encodeURIComponent(PASS)).catch(function(){}); }, 5000); }
}
async function tira(){
  try{
    /* un errore dentro disegna() non deve fermare l aggiornamento */
    const r = await fetch(API + '?dati=1&periodo=' + periodo + '&t=' + encodeURIComponent(PASS));
    if(r.status === 401){ sessionStorage.clear(); location.reload(); return; }
    stato = await r.json();
    if(!stato.richiami) stato.richiami = [];
    if(!sel || !stato.vive.some(v=>v.conversazione===sel)) sel = stato.vive.length ? stato.vive[0].conversazione : null;
    try{ disegna(); }
    catch(e){ if(window.onerror) window.onerror('disegna: ' + (e && e.message ? e.message : e), '', 0, 0); }
  }catch(e){}
}
function righe(coppie){
  const b = coppie.filter(x=>x[1]).map(([k,v])=>'<div class="coppia"><dt>'+esc(k)+'</dt><dd>'+esc(v)+'</dd></div>').join('');
  return b ? '<dl>'+b+'</dl>' : '<p class="attesa">Non ancora raccolto.</p>';
}
async function chiudiRiga(c){
  await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({t: PASS, chiudi: c})});
  sel = null; muto = false; tre = false; tira();
}
function disegna(){
  /* la pagina si ridisegna ogni tre secondi: senza questo, quello che si sta
     scrivendo (o dettando) nella barra dei suggerimenti sparisce da solo */
  const iPrima = document.getElementById('sugg');
  const testoInCorso = iPrima ? iPrima.value : null;
  const avevaIlFuoco = iPrima ? (document.activeElement === iPrima) : false;
  const cursore = iPrima ? iPrima.selectionStart : 0;

  $('orologio').textContent = new Date().toLocaleTimeString('it-IT');
  $('nLive').textContent = stato.vive.length; $('conta').textContent = stato.vive.length;
  $('linee').innerHTML = stato.vive.length ? stato.vive.map(v =>
    '<button class="linea" data-c="'+esc(v.conversazione)+'" aria-current="'+(v.conversazione===sel)+'">'+
    '<span class="spia '+esc(v.livello)+'"></span><span>'+
    '<span class="l-nome">'+esc(Nome(v.nome)||v.telefono||'sconosciuto')+'</span>'+
    '<span class="l-dati">'+esc(v.dove||'')+' - <b>'+mmss(v.secondi)+'</b></span>'+
    '<span class="l-flash '+esc(v.livello)+'">'+esc(v.flash||'')+'</span><span class="onda"><i></i><i></i><i></i><i></i><i></i><i></i></span></span></button>').join('')
    : '<div class="linea spenta"><span class="spia"></span><span>'+
      '<span class="l-nome spento">Nessuno in linea</span>'+
      '<span class="l-dati">le telefonate compaiono qui appena partono</span></span></div>';
  document.querySelectorAll('.linea').forEach(b => b.onclick = () => { sel = b.dataset.c; muto=false; tre=false; disegna(); });

  const v = stato.vive.find(x => x.conversazione === sel);
  if(!v){
    /* a riposo la regia non resta bianca: mostra le sue stanze vuote,
       cosi si sa gia dove guardare quando squillera */
    $('centro').innerHTML =
      '<div class="banda spenta"><span class="bollo"></span><span><h3>Nessuna telefonata in corso</h3>'+
        '<p>Quando Valentino chiama, qui compare chi ha al telefono e cosa sta succedendo.</p></span></div>'+
      '<div class="capo"><div><h1 class="spento">&mdash;</h1><div class="sotto"><span>comune</span><span>telefono</span><span>campagna</span></div></div>'+
        '<div class="grosso spento">00:00<small>in linea</small></div></div>'+
      '<div class="salienti"><p class="et">Punti salienti</p><p class="attesa">Qui compaiono i momenti che Valentino segnala mentre parla.</p></div>'+
      '<div class="parlato"><p class="et">Cosa si stanno dicendo</p>'+
        '<p class="attesa">La conversazione si scrive qui, parola per parola, mentre si parla.</p></div>'+
      '<div class="suggerisci"><input placeholder="Suggerisci a Valentino cosa dire&hellip;" disabled>'+
        '<button disabled aria-label="detta a voce"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">'+
        '<rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></button>'+
        '<button disabled>Manda</button></div>'+
      '<div class="banco">'+
        '<button class="tasto" disabled><span class="led"></span>Ascolta in silenzio</button>'+
        '<button class="tasto entra" disabled><span class="led"></span>Entra in voce</button>'+
        '<button class="tasto chiudi" disabled>Chiudi la linea</button></div>';
    $('dx').innerHTML =
      '<div class="titolo"><h2>La sua pratica</h2><span class="conta">a riposo</span></div>'+
      '<div class="vincoli"><span class="bollo"></span><span><b>Vincoli sul tetto</b>In attesa di una telefonata</span></div>'+
      '<div class="blocco"><p class="etich">Cosa ha chiesto</p><p class="attesa">Il modulo compilato dal cliente.</p></div>'+
      '<div class="blocco"><p class="etich">Il tetto</p>'+righe([['Falde',''],['Esposizione',''],['Ci stanno',''],['Potenza',''],['Produzione',''],['Verificato','']])+'</div>'+
      '<div class="blocco"><p class="etich">Quello che ha detto</p>'+righe([['Bolletta',''],['Consumo stimato',''],['In casa',''],['Di giorno',''],['Riscaldamento',''],['Contatore',''],['Auto','']])+'</div>'+
      '<div class="blocco"><p class="etich">Sul tavolo</p><p class="attesa">Nessuna proposta ancora messa sul tavolo.</p></div>';
    $('foglioArric').innerHTML = '<h1>Arricchimento</h1>'+
      '<p class="occhio">Quello che sappiamo del cliente prima di chiamarlo</p>'+
      '<div class="carta"><h4>La sintesi</h4><p class="attesa">Il ritratto del contatto, messo insieme dal modulo e dalla rete.</p></div>'+
      '<div class="carta"><h4>Le voci trovate</h4><p class="attesa">Zona, immobile, presenza in rete, omonimi, allarmi.</p></div>'+
      '<div class="carta"><h4>Il modulo, per intero</h4><p class="attesa">Le risposte date sui social, parola per parola.</p></div>'+
      '<div class="carta"><h4>Il contatto</h4>'+righe([['Comune',''],['Indirizzo',''],['Provincia',''],['Campagna',''],['Quando ha chiesto',''],['Stato','']])+'</div>';
  } else {
  const m = v.momenti||[], s = v.scheda||{}, t = s.tetto||{}, voci = s.voci||null;
  /* ascolto dal vivo sospeso: il canale di ElevenLabs rifiuta la chiave, riaprirlo ogni giro bloccava la pagina */
  $('centro').innerHTML =
    '<div class="banda '+esc(v.livello)+'"><span class="bollo"></span><span><h3>'+esc(v.titolo||'Telefonata in corso')+'</h3><p>'+esc(v.motivo||'')+'</p></span><span class="quando">'+esc((v.cambiata_il||'').slice(11,16))+'</span></div>'+
    '<div class="capo"><div><h1>'+esc(Nome(v.nome)||v.telefono||'sconosciuto')+'</h1><div class="sotto"><span>'+esc(v.dove||'')+'</span><span>'+esc(v.telefono||'')+'</span><span>'+esc(v.fonte||'')+'</span></div></div><div class="grosso">'+mmss(v.secondi)+'<small>in linea</small></div></div>'+
    '<div class="salienti"><p class="et">Punti salienti</p>'+ (m.length
      ? '<div class="sal-righe">'+m.slice().reverse().map(x=>'<div class="sal '+esc(x.livello)+'"><time>'+esc(x.ora)+'</time><span>'+esc(x.cosa)+'</span></div>').join('')+'</div>'
      : '<p class="attesa">Qui compaiono i momenti che Valentino segnala mentre parla.</p>')+'</div>'+
    (muto? '<div class="avviso muto"><span class="pt"></span>Sta ascoltando la telefonata: il cliente non la sente</div>':'')+
    (tre? '<div class="avviso tre"><span class="pt"></span>Per entrare in voce chiami il cliente dal suo telefono: il ponte audio non e ancora attivo</div>':'')+
    '<div class="parlato" id="parlato"></div>'+
    '<div class="suggerisci">'+
      '<input id="sugg" placeholder="Suggerisci a Valentino cosa dire&hellip; (il cliente non sente)" autocomplete="off">'+
      '<button id="bDett" class="dett" aria-pressed="false" title="detta a voce" aria-label="detta a voce">'+
        '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">'+
        '<rect x="9" y="3" width="6" height="11" rx="3"></rect>'+
        '<path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></button>'+
      '<button id="bSugg">Manda</button>'+
    '</div>'+
    '<div class="detto" id="detto"></div>'+
    '<div class="banco">'+
      '<button class="tasto" id="bAsc" aria-pressed="'+muto+'"><span class="led"></span>'+(muto?'Audio acceso':'Senti la voce')+'</button>'+
      '<button class="tasto entra" id="bEnt" disabled title="serve il ponte telefonico: non e ancora possibile"><span class="led"></span>Entra in voce <em>presto</em></button>'+
      '<button class="tasto prendi" id="bPrendi" data-stato="'+statoTel+'">Prendo io la chiamata</button>'+
      '<button class="tasto chiudi" id="bChi">Chiudi la linea</button>'+
    '</div>';
  /* il collegamento con la telefonata si apre da solo: serve per le parole,
     non per l audio, e senza di lui la conversazione non si scriverebbe */
  if(!v.chiusa_il && audioConv !== v.conversazione) accendiAscolto(v.conversazione);
  dipingiParlato();
  /* si rimette quello che stava scrivendo, e il cursore dov era */
  const iDopo = document.getElementById('sugg');
  if(iDopo && testoInCorso !== null && testoInCorso !== ''){
    iDopo.value = testoInCorso;
    if(avevaIlFuoco){ iDopo.focus(); try{ iDopo.setSelectionRange(cursore, cursore); }catch(e){} }
  }
  if(ricon && iDopo){ const b = document.getElementById('bDett'); if(b) b.setAttribute('aria-pressed','true'); }
  $('bSugg').onclick = () => mandaSuggerimento(v.conversazione);
  $('sugg').onkeydown = (e) => { if(e.key === 'Enter') mandaSuggerimento(v.conversazione); };
  $('bDett').onclick = () => detta();
  $('bAsc').onclick = async () => {
    if(!muto){
      /* l audio si apre solo qui: il browser vuole un click per farlo suonare */
      try{
        if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if(ctx.state === 'suspended') await ctx.resume();
        quando = 0; muto = true;
      }catch(e){ avvisa('il browser non apre l audio'); }
    } else {
      muto = false;
    }
    disegna();
  };
  /* Entra in voce resta spento finche la telefonata non passa da un ponte
     nostro: ElevenLabs, messa la chiamata in conferenza, toglie l agente. */
  $('bChi').onclick = () => chiudiRiga(v.conversazione);
  $('bPrendi').onclick = () => prendiChiamata(v.conversazione);

  $('dx').innerHTML =
    '<div class="titolo"><h2>La sua pratica</h2><span class="conta">dal vivo</span></div>'+
    '<div class="vincoli '+(t.semaforo==="verde"?"ok":t.semaforo==="rosso"?"no":t.vincoli?"att":"")+'">'+
      '<span class="bollo"></span><span><b>Vincoli sul tetto</b>'+
      esc(t.vincoli || "Non ancora verificati")+'</span></div>'+
    '<div class="blocco"><p class="etich">Chi e</p>'+
      (s.sintesi? '<p class="sintesi">'+esc(corto(s.sintesi,320))+'</p>' : '<p class="attesa">Nessun ritratto del contatto.</p>')+'</div>'+
    '<div class="blocco"><p class="etich">Cosa ha chiesto</p>'+
      (s.cosa_ha_risposto? '<p class="sintesi">'+esc(corto(s.cosa_ha_risposto,200))+'</p>' : '<p class="attesa">Nessun modulo collegato.</p>')+'</div>'+
    '<div class="blocco"><p class="etich">Il tetto</p>'+
      (t.vincoli? '<div class="esitov '+(t.semaforo==='verde'?'ok':t.semaforo==='rosso'?'no':'att')+'">'+esc(t.vincoli)+'</div>':'')+
      '<div style="margin-top:'+(t.vincoli?'10px':'0')+'">'+righe([['Falde',t.falde],['Esposizione',t.inclinazione],['Ci stanno',t.moduli],['Potenza',t.potenza],['Produzione',t.produzione],['Verificato',t.verificato||t.analizzato]])+'</div>'+
      (s.posizione_confermata? '<p class="sintesi" style="margin-top:9px">Croce sul tetto confermata dal cliente.</p>':'')+'</div>'+
    '<div class="blocco"><p class="etich">Quello che ha detto</p>'+
      righe([['Bolletta',s.bolletta],['Consumo stimato',s.consumo],['In casa',s.persone],['Di giorno',s.giorno],['Riscaldamento',s.riscaldamento],['Contatore',s.contatore],['Auto',s.auto]])+'</div>'+
    '<div class="blocco"><p class="etich">Sul tavolo</p>'+ (s.prezzo
      ? '<div class="offerta"><div class="prezzo">'+esc(s.prezzo)+'</div><div class="righe">'+esc(s.configurazione||'')+'</div></div>'
      : '<p class="attesa">Nessuna proposta ancora messa sul tavolo.</p>')+'</div>';

  $('foglioArric').innerHTML = '<h1>'+esc(Nome(v.nome)||v.telefono||'')+'</h1>'+
    '<p class="occhio">Arricchimento del contatto - '+esc(v.dove||'')+' - '+esc(v.fonte||'')+'</p>'+
    (s.sintesi? '<div class="carta"><h4>La sintesi</h4><p class="sintesi">'+esc(s.sintesi)+'</p></div>':'')+
    (voci? '<div class="carta"><h4>Le voci trovate</h4>'+righe(Object.entries(voci))+'</div>':'')+
    (s.cosa_ha_risposto? '<div class="carta"><h4>Il modulo, per intero</h4><p class="sintesi">'+esc(s.cosa_ha_risposto)+'</p></div>':'')+
    '<div class="carta"><h4>Il contatto</h4>'+righe([['Comune',s.dove],['Indirizzo',s.indirizzo],['Provincia',s.provincia],['Campagna',s.campagna],['Quando ha chiesto',(s.quando_ha_chiesto||'').slice(0,16).replace('T',' ')],['Stato',s.stato],['Non disturbare', s.non_disturbare? 'si':'']])+'</div>';
  }

  /* chi aspetta di essere richiamato */
  const rr = stato.richiami || [];
  $('nRich').textContent = rr.length;
  $('tRich').classList.toggle('urgente', rr.some(x => x.urgenza === 'adesso' || x.urgenza === 'a momenti'));
  $('corpoRich').innerHTML = rr.length ? rr.map(x =>
    '<div class="rich '+esc(x.urgenza.replace(/ /g,'-'))+'">'+
      '<div class="rich-quando"><b>'+esc(orario(x.quando))+'</b><span>'+esc(x.urgenza)+'</span></div>'+
      '<div class="rich-chi">'+
        '<button class="tastoNome" data-tel="'+esc(x.telefono)+'">'+esc(Nome(x.nome)||x.telefono)+'</button>'+
        (x.perche? '<p class="sintesi">'+esc(x.perche)+'</p>' : '')+
      '</div>'+
      '<div class="rich-fare">'+
        '<button class="tasto" data-chiama="'+esc(x.telefono)+'">Chiama ora</button>'+
        '<button class="tasto" data-fatto="'+esc(x.id)+'">Fatto</button>'+
      '</div>'+
    '</div>').join('')
    : '<p class="vuoto">Nessuno in attesa di essere richiamato.</p>';
  document.querySelectorAll('#corpoRich .tastoNome').forEach(b => b.onclick = () => apriCliente(b.dataset.tel));
  document.querySelectorAll('#corpoRich [data-fatto]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    try{ await fetch(API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({t: PASS, richiamo_fatto: b.dataset.fatto})}); }catch(e){}
    tira();
  });
  document.querySelectorAll('#corpoRich [data-chiama]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = 'sto chiamando...';
    try{
      const r = await fetch(API + '-chiama', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({t: PASS, telefono: b.dataset.chiama})});
      const j = await r.json();
      b.textContent = (j && j.ok) ? 'sta squillando' : 'non parte';
    }catch(e){ b.textContent = 'non parte'; }
    setTimeout(tira, 2500);
  });

  /* la tabella dello storico si ridisegna solo quando cambia davvero:
     con quattrocento righe, rifarla ogni tre secondi inchioda la pagina */
  const firma = periodo + '|' + stato.chiuse.length + '|' + (stato.chiuse[0] ? stato.chiuse[0].id : '');
  if(firma !== firmaChiuse){
  firmaChiuse = firma;
  $('corpoChiuse').innerHTML = stato.chiuse.length ? stato.chiuse.map(c =>
    '<tr><td class="nomeCell">'+(c.chiamante
        ? '<button class="tastoNome" data-tel="'+esc(c.chiamante)+'">'+esc(Nome(c.chi)||c.chiamante)+'</button>'
        : esc(Nome(c.chi)||''))+'</td>'+
    '<td class="num">'+esc((c.quando||'').slice(0,16).replace('T',' '))+'</td>'+
    '<td class="num">'+mmss(c.durata_sec||0)+'</td>'+
    '<td>'+esc(corto(c.di_cosa,220))+'</td>'+
    '<td class="ascCell">'+(c.audio
        ? '<audio controls preload="none" src="'+esc(c.audio)+'"></audio>'+
          '<a class="apri" href="'+esc(c.audio)+'" target="_blank" rel="noopener" title="apri in una scheda a parte">apri</a>'
        : '-')+'</td></tr>').join('')
    : '<tr><td colspan="5" style="color:var(--ink-3)">Nessuna telefonata in questo periodo.</td></tr>';
  document.querySelectorAll('.tastoNome').forEach(b => b.onclick = () => apriCliente(b.dataset.tel));
  $('sottoChiuse').textContent = stato.chiuse.length + ' telefonate';
  }
}
/* ---- la scheda del cliente, aperta cliccando il suo nome ---- */
async function apriCliente(tel){
  if(!tel) return;
  let d;
  try{
    const r = await fetch(API + '?cliente=' + encodeURIComponent(tel) + '&t=' + encodeURIComponent(PASS));
    d = await r.json();
  }catch(e){ return; }
  const s = d.scheda || {}, t = s.tetto || {}, voci = s.voci || null;
  const tel_ = d.telefonate || [];
  const velo = document.createElement('div');
  velo.className = 'velo';
  velo.innerHTML =
    '<div class="pannello">'+
      '<div class="testa"><div><h2>'+esc(Nome(d.nome)||tel)+'</h2>'+
        '<p>'+esc(tel)+(d.dove? ' &middot; '+esc(d.dove):'')+' &middot; '+(d.quante||0)+' telefonate</p></div>'+
        '<button class="via" aria-label="chiudi">&times;</button></div>'+
      (s.sintesi? '<div class="blocco"><p class="etich">Chi e</p><p class="sintesi">'+esc(s.sintesi)+'</p></div>':'')+
      '<div class="blocco"><p class="etich">Cosa ha chiesto</p>'+
        (s.cosa_ha_risposto? '<p class="sintesi">'+esc(s.cosa_ha_risposto)+'</p>' : '<p class="attesa">Nessun modulo collegato.</p>')+'</div>'+
      '<div class="blocco"><p class="etich">Il tetto</p>'+
        (t.vincoli? '<div class="esitov '+(t.semaforo==="verde"?"ok":t.semaforo==="rosso"?"no":"att")+'">'+esc(t.vincoli)+'</div>':'')+
        righe([['Falde',t.falde],['Esposizione',t.inclinazione],['Ci stanno',t.moduli],['Potenza',t.potenza],['Produzione',t.produzione],['Verificato',t.verificato||t.analizzato]])+'</div>'+
      '<div class="blocco"><p class="etich">Quello che ha detto</p>'+
        righe([['Bolletta',s.bolletta],['Consumo stimato',s.consumo],['In casa',s.persone],['Di giorno',s.giorno],['Riscaldamento',s.riscaldamento],['Contatore',s.contatore],['Auto',s.auto],['Sul tavolo',s.prezzo]])+'</div>'+
      (voci? '<div class="blocco"><p class="etich">Le voci trovate</p>'+righe(Object.entries(voci))+'</div>':'')+
      '<div class="blocco"><p class="etich">Come e andata, volta per volta</p></div>'+
      (tel_.length? tel_.map(x =>
        '<div class="tel-riga"><div class="tel-capo">'+
          '<span class="spia '+esc(x.livello||"verde")+'"></span>'+
          '<time>'+esc((x.quando||"").slice(0,16).replace("T"," "))+'</time>'+
          '<span>'+esc(x.flash||"")+'</span>'+
          '<span class="dur">'+mmss(x.secondi||0)+'</span></div>'+
        ((x.momenti&&x.momenti.length)? '<ul class="tel-mom">'+x.momenti.map(m=>'<li><time>'+esc(m.ora)+'</time>'+esc(m.cosa)+'</li>').join('')+'</ul>':'')+
        '<div style="margin-top:9px"><audio controls preload="none" src="'+esc(API+"-registrazione?c="+encodeURIComponent(x.conversazione)+"&t="+encodeURIComponent(PASS))+'"></audio></div>'+
        '</div>').join('') : '<p class="vuoto">Nessuna telefonata registrata.</p>')+
    '</div>';
  velo.onclick = (e) => { if(e.target === velo || e.target.classList.contains('via')) velo.remove(); };
  document.body.appendChild(velo);
}

document.querySelectorAll('.per').forEach(b => b.onclick = () => {
  periodo = b.dataset.p;
  firmaChiuse = '';
  document.querySelectorAll('.per').forEach(x => x.setAttribute('aria-pressed', x===b));
  tira();
});
function scheda(q){
  ['tLinea','tArric','tRich','tChiuse'].forEach(k => $(k).setAttribute('aria-selected', k===q));
  $('vLinea').classList.toggle('nascosto', q!=='tLinea');
  $('vArric').classList.toggle('nascosto', q!=='tArric');
  $('vRich').classList.toggle('nascosto', q!=='tRich');
  $('vChiuse').classList.toggle('nascosto', q!=='tChiuse');
}
$('bTema').onclick = () => tema(document.documentElement.getAttribute('data-tema') === 'chiaro' ? 'scuro' : 'chiaro');
$('tLinea').onclick = () => scheda('tLinea');
$('tArric').onclick = () => scheda('tArric');
$('tRich').onclick = () => scheda('tRich');
$('tChiuse').onclick = () => scheda('tChiuse');
/* si puo entrare anche con il lasciapassare nell indirizzo: serve quando la
   pagina viene ricaricata forzando e la parola d ordine se ne va con la sessione */
(function(){
  try{
    const u = new URLSearchParams(location.search);
    const t = u.get('t');
    if(t){
      PASS = t;
      CHI = u.get('chi') || CHI || 'regia';
      sessionStorage.setItem('regia_pass', PASS);
      sessionStorage.setItem('regia_chi', CHI);
    }
  }catch(e){}
})();
if(PASS) apri();
/* il telefono si accende da solo appena si entra, cosi e gia pronto
   quando serve: senza, il primo passaggio di chiamata perderebbe secondi */
setTimeout(accendiTelefono, 1200);
